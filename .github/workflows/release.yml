# Builds the Windows installer. Pushing a version tag (e.g. `git tag v0.1.0 &&
# git push origin v0.1.0`) also publishes it as a GitHub release. Can be run
# by hand from the Actions tab to get an installer without releasing.
#
# Actions are pinned to exact commits (with the version in a comment), so a
# moved or compromised tag can't change what builds the installer.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write # only needed to create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          ./installer/build-installer.ps1 -Version $version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TTSFreeUse-Setup
          path: artifacts/TTSFreeUse-Setup-*.exe

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem artifacts/TTSFreeUse-Setup-*.exe).FullName
          gh release create $env:GITHUB_REF_NAME $installer --repo $env:GITHUB_REPOSITORY --title "TTSFreeUse $env:GITHUB_REF_NAME" --generate-notes

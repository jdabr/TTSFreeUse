<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTSFreeUse</title>
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --text: #1f2328; --muted: #656d76;
    --border: #d8dee4; --accent: #2f6f5e; --accent-text: #ffffff; --error: #b42318;
    --track: #e4e7eb;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161a1d; --panel: #1f2428; --text: #e6edf3; --muted: #9198a1;
      --border: #3a4148; --accent: #4fae94; --accent-text: #0d1117; --error: #ff7b72;
      --track: #30363d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .subtitle { color: var(--muted); margin: 0 0 24px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 16px;
  }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tabs button {
    background: none; border: 1px solid transparent; color: var(--muted);
    padding: 6px 14px; border-radius: 6px; font: inherit; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { border-color: var(--border); color: var(--text); background: var(--bg); }
  textarea {
    width: 100%; min-height: 200px; resize: vertical; padding: 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
    font: inherit;
  }
  .count { color: var(--muted); font-size: 0.85rem; text-align: right; margin-top: 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; margin-top: 16px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
  select, input[type="file"] {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit; max-width: 100%;
  }
  input[type="range"] { width: 160px; accent-color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-left: auto; }
  button.primary, button.secondary {
    padding: 9px 20px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary { border: none; background: var(--accent); color: var(--accent-text); }
  button.secondary { border: 1px solid var(--accent); background: none; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--muted); font-size: 0.85rem; margin: 10px 0 0; }
  .status { min-height: 1.5em; color: var(--muted); margin: 0; }
  .error { color: var(--error); }
  audio { width: 100%; margin-top: 12px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 12px 0; border-top: 1px solid var(--border); }
  .list li:first-child { border-top: none; padding-top: 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .name { font-weight: 600; overflow-wrap: anywhere; flex: 1 1 200px; }
  .meta { color: var(--muted); font-size: 0.85rem; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: var(--accent); transition: width 0.4s; }
  .link {
    background: none; border: none; padding: 0; font: inherit; font-size: 0.9rem;
    color: var(--accent); cursor: pointer; text-decoration: underline;
  }
  .link.danger { color: var(--error); }
  .empty { color: var(--muted); margin: 0; }
  footer { color: var(--muted); font-size: 0.85rem; text-align: center; margin-top: 24px; }
  footer a { color: inherit; }
  @media (max-width: 560px) { .actions { margin-left: 0; width: 100%; } .actions button { flex: 1; } }
</style>
</head>
<body>
<main>
  <h1>TTSFreeUse</h1>
  <p class="subtitle">Free, offline text-to-speech for books and documents.</p>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="text">Paste text</button>
      <button role="tab" aria-selected="false" data-tab="file">Upload file</button>
    </div>

    <div id="tab-text">
      <textarea id="text" placeholder="Paste or type some text to hear it read aloud…">Welcome to TTSFreeUse. This voice runs entirely on your own computer, so your documents never leave your machine. Try pasting a paragraph from a technical book, then pick a different voice or speed and listen again.</textarea>
      <div class="count" id="count"></div>
    </div>

    <div id="tab-file" hidden>
      <label>PDF, DOCX, or TXT file
        <input type="file" id="file" accept=".pdf,.docx,.txt">
      </label>
    </div>

    <div class="controls">
      <label>Voice
        <select id="voice"></select>
      </label>
      <label><span>Speed: <span id="speed-value">1.0×</span></span>
        <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
      </label>
      <label>Save as
        <select id="format">
          <option value="Mp3">MP3 — plays everywhere</option>
          <option value="M4b">M4B — audiobook apps</option>
          <option value="Wav">WAV — uncompressed</option>
        </select>
      </label>
      <div class="actions">
        <button class="secondary" id="listen" disabled>Listen now</button>
        <button class="primary" id="save" disabled>Save audio file</button>
      </div>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="panel">
    <p class="status" id="status">Connecting…</p>
    <div id="player" hidden>
      <audio id="audio" controls></audio>
    </div>
  </section>

  <section class="panel" id="jobs-panel" hidden>
    <h2>Conversions</h2>
    <ul class="list" id="jobs"></ul>
  </section>

  <section class="panel">
    <h2>Your audio files</h2>
    <ul class="list" id="library"></ul>
    <p class="hint" id="library-hint"></p>
  </section>

  <footer>Everything runs on your computer — nothing is uploaded. Please use documents you have the right to use.
    · <a href="/swagger">API</a></footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let mode = 'text';
  let ready = false;
  let listening = false;
  let audioUrl = null;
  let jobsTimer = null;
  const knownDone = new Set();

  // ---------- helpers ----------
  function setStatus(message, isError = false) {
    $('status').textContent = message;
    $('status').classList.toggle('error', isError);
  }

  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children.filter((c) => c != null));
    return node;
  }

  function formatDuration(seconds) {
    if (seconds == null) return '';
    const s = Math.round(seconds);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`;
  }

  function formatSize(bytes) {
    return bytes >= 1e9 ? (bytes / 1e9).toFixed(1) + ' GB'
         : bytes >= 1e6 ? (bytes / 1e6).toFixed(1) + ' MB'
         : Math.max(1, Math.round(bytes / 1e3)) + ' KB';
  }

  async function errorText(res) {
    const text = await res.text();
    try { const j = JSON.parse(text); return j.title || j.detail || text; } catch { return text; }
  }

  function options() {
    return { voice: $('voice').value, speed: Number($('speed').value) };
  }

  function updateButtons() {
    const hasInput = mode === 'text' ? $('text').value.trim().length > 0 : $('file').files.length > 0;
    $('listen').disabled = !ready || listening || !hasInput;
    $('save').disabled = !ready || !hasInput;
    $('listen').hidden = mode === 'file';
    $('hint').textContent = mode === 'text'
      ? '“Listen now” plays right away. “Save audio file” makes a file you can keep or copy to your phone.'
      : 'Documents are converted in the background — you can keep using the page while it works.';
  }

  function updateCount() {
    const words = $('text').value.trim().split(/\s+/).filter(Boolean).length;
    // ~150 spoken words per minute at normal speed
    const minutes = words / 150 / Number($('speed').value);
    $('count').textContent = words
      ? `${words.toLocaleString()} words · ${minutes < 1 ? 'under a minute' : 'about ' + Math.round(minutes) + ' min'} of audio`
      : '';
  }

  // ---------- engine status & voices ----------
  async function waitForEngine() {
    try {
      const s = await (await fetch('/api/speech/status')).json();
      ready = s.ready;
      if (ready) {
        if (!listening) setStatus('Ready.');
        await loadVoices();
      } else {
        setStatus(s.status);
        setTimeout(waitForEngine, 1500);
      }
    } catch {
      setStatus('Can’t reach the TTSFreeUse server. Is it running?', true);
      setTimeout(waitForEngine, 3000);
    }
    updateButtons();
  }

  async function loadVoices() {
    const data = await (await fetch('/api/speech/voices')).json();
    const groups = {};
    for (const v of data.voices) {
      const key = `${v.language === 'en-GB' ? 'British' : 'American'} ${v.gender}`;
      (groups[key] ??= []).push(v);
    }
    const select = $('voice');
    select.innerHTML = '';
    for (const [name, voices] of Object.entries(groups)) {
      const group = el('optgroup', { label: name });
      for (const v of voices) group.append(new Option(v.name, v.id, false, v.id === data.defaultVoice));
      select.append(group);
    }
  }

  // ---------- listen now (instant) ----------
  async function listenNow() {
    listening = true;
    updateButtons();
    const started = Date.now();
    const tick = setInterval(() =>
      setStatus(`Generating speech… ${Math.round((Date.now() - started) / 1000)}s`), 500);
    setStatus('Generating speech…');
    try {
      const res = await fetch('/api/speech/text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: $('text').value, ...options() }),
      });
      if (!res.ok) { setStatus(await errorText(res) || `Something went wrong (${res.status}).`, true); return; }
      playUrl(URL.createObjectURL(await res.blob()), true);
      setStatus(`Done in ${((Date.now() - started) / 1000).toFixed(1)}s.`);
    } catch (e) {
      setStatus('Request failed: ' + e.message, true);
    } finally {
      clearInterval(tick);
      listening = false;
      updateButtons();
    }
  }

  function playUrl(url, isBlob = false, label = null) {
    if (audioUrl && audioUrl.startsWith('blob:')) URL.revokeObjectURL(audioUrl);
    audioUrl = url;
    $('audio').src = url;
    $('player').hidden = false;
    if (label) setStatus('Playing: ' + label);
    $('audio').play().catch(() => {});
  }

  // ---------- save audio file (background job) ----------
  async function saveFile() {
    $('save').disabled = true;
    const format = $('format').value;
    let res;
    try {
      if (mode === 'text') {
        res = await fetch('/api/jobs/text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: $('text').value, format, ...options() }),
        });
      } else {
        const form = new FormData();
        form.append('file', $('file').files[0]);
        const o = options();
        form.append('voice', o.voice);
        form.append('speed', o.speed);
        form.append('format', format);
        res = await fetch('/api/jobs/file', { method: 'POST', body: form });
      }
      if (!res.ok) { setStatus(await errorText(res) || `Something went wrong (${res.status}).`, true); return; }
      setStatus('Added to the conversion list below.');
      if (mode === 'file') $('file').value = '';
      refreshJobs();
    } catch (e) {
      setStatus('Request failed: ' + e.message, true);
    } finally {
      updateButtons();
    }
  }

  async function refreshJobs() {
    clearTimeout(jobsTimer);
    let jobs = [];
    try { jobs = await (await fetch('/api/jobs')).json(); } catch { /* server restarting */ }

    const list = $('jobs');
    list.innerHTML = '';
    $('jobs-panel').hidden = jobs.length === 0;
    let finishedNow = false;

    for (const j of jobs) {
      const active = ['Queued', 'Narrating', 'Encoding'].includes(j.state);
      if (j.state === 'Completed' && !knownDone.has(j.id)) { knownDone.add(j.id); finishedNow = true; }

      let detail;
      if (j.state === 'Queued') detail = 'Waiting…';
      else if (j.state === 'Narrating') detail = `${Math.round(j.progress * 100)}%` +
        (j.secondsRemaining != null ? ` · about ${formatDuration(j.secondsRemaining)} left` : '');
      else if (j.state === 'Encoding') detail = j.statusText || 'Converting…';
      else if (j.state === 'Completed') detail = `Done · ${formatDuration(j.audioSeconds)} of audio · saved as ${j.fileName}`;
      else if (j.state === 'Cancelled') detail = 'Cancelled';
      else detail = 'Failed: ' + (j.error || 'unknown error');

      const actions = active
        ? el('button', { className: 'link danger', textContent: 'Cancel',
            onclick: () => fetch(`/api/jobs/${j.id}/cancel`, { method: 'POST' }).then(refreshJobs) })
        : el('button', { className: 'link', textContent: 'Remove from list',
            onclick: () => fetch(`/api/jobs/${j.id}`, { method: 'DELETE' }).then(refreshJobs) });

      list.append(el('li', {},
        el('div', { className: 'row' },
          el('span', { className: 'name', textContent: `${j.title} (${j.format.toUpperCase()})` }),
          actions),
        el('div', { className: 'meta' + (j.state === 'Failed' ? ' error' : ''), textContent: detail }),
        active ? el('div', { className: 'bar' }, el('div', { style: `width:${Math.round(j.progress * 100)}%` })) : null));
    }

    if (finishedNow) refreshLibrary();
    if (jobs.some((j) => ['Queued', 'Narrating', 'Encoding'].includes(j.state)))
      jobsTimer = setTimeout(refreshJobs, 1000);
  }

  // ---------- library ----------
  async function refreshLibrary() {
    let data;
    try { data = await (await fetch('/api/library')).json(); } catch { return; }
    const list = $('library');
    list.innerHTML = '';
    if (data.items.length === 0)
      list.append(el('li', {}, el('p', { className: 'empty', textContent: 'Saved audio files will appear here.' })));

    for (const item of data.items) {
      const url = '/api/library/' + encodeURIComponent(item.fileName);
      const confirmBox = el('span', { hidden: true },
        el('span', { className: 'meta', textContent: 'Delete this file? ' }),
        el('button', { className: 'link danger', textContent: 'Yes, delete',
          onclick: async () => {
            await fetch(url, { method: 'DELETE' });
            if (audioUrl === url) { $('audio').pause(); $('player').hidden = true; }
            refreshLibrary();
          } }),
        ' ',
        el('button', { className: 'link', textContent: 'Keep', onclick: () => { confirmBox.hidden = true; } }));

      list.append(el('li', {},
        el('div', { className: 'row' },
          el('span', { className: 'name', textContent: item.fileName }),
          el('button', { className: 'link', textContent: 'Play', onclick: () => playUrl(url, false, item.fileName) }),
          el('a', { className: 'link', href: url + '?download=true', textContent: 'Download' }),
          el('button', { className: 'link danger', textContent: 'Delete', onclick: () => { confirmBox.hidden = false; } })),
        el('div', { className: 'meta' },
          `${formatSize(item.sizeBytes)} · ${new Date(item.created).toLocaleString()} `, confirmBox)));
    }
    $('library-hint').textContent = `Files are saved in ${data.directory}. ` +
      'To listen on your phone, copy them over with a USB cable or put them in your cloud storage (OneDrive, Google Drive, iCloud).';
  }

  // ---------- wiring ----------
  document.querySelectorAll('.tabs button').forEach((tab) => {
    tab.addEventListener('click', () => {
      mode = tab.dataset.tab;
      document.querySelectorAll('.tabs button').forEach((t) => t.setAttribute('aria-selected', t === tab));
      $('tab-text').hidden = mode !== 'text';
      $('tab-file').hidden = mode !== 'file';
      updateButtons();
    });
  });
  $('text').addEventListener('input', () => { updateCount(); updateButtons(); });
  $('file').addEventListener('change', updateButtons);
  $('speed').addEventListener('input', () => {
    $('speed-value').textContent = Number($('speed').value).toFixed(1) + '×';
    updateCount();
  });
  $('listen').addEventListener('click', listenNow);
  $('save').addEventListener('click', saveFile);
  $('text').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !$('listen').disabled) listenNow();
  });

  updateCount();
  updateButtons();
  waitForEngine();
  refreshJobs();
  refreshLibrary();
</script>
</body>
</html>
